name: Publish CLI to npm

# Publishes packages/cli as the `apikeychain` npm package when a GitHub release
# is published. Uses npm trusted publishing (OIDC), so no npm token is stored.
# One-time setup on npmjs.com: package settings → Trusted publisher → GitHub Actions,
# repository UsmanSanawar/Api-Key-Chain, workflow file publish-cli.yml.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Build the CLI
        run: npm run pack:cli

      - name: Check the package version matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./packages/cli/package.json').version")
          cli=$(node packages/cli/apikeychain.mjs --version)
          echo "tag=$tag package=$pkg cli=$cli"
          [ "$tag" = "$pkg" ] && [ "$pkg" = "$cli" ]

      - name: Publish
        working-directory: packages/cli
        run: npm publish --access public
